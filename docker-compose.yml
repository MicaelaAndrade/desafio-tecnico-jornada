# Os serviços não fixam `container_name` de propósito. Nome fixo colide quando
# um `up` interrompido deixa contêineres pendurados — o próximo `up` falha com
# "container with given ID already exists", e pior, o DNS interno pode resolver
# o nome para um contêiner morto, o que aparece como banco inalcançável. Sem
# ele, o Compose prefixa os nomes com o do projeto e essa classe de falha
# desaparece. O custo é digitar `docker compose logs api` em vez de
# `docker logs jornada-api`, que é o que o README já recomenda.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jornada
      POSTGRES_PASSWORD: jornada
      POSTGRES_DB: jornada
      # O banco roda em UTC. Toda conversão para fuso local acontece na aplicação,
      # a partir do fuso gravado em cada marcação (ver ADR-0004).
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - jornada-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jornada -d jornada']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jornada:jornada@db:5432/jornada?schema=public
      JWT_SECRET: segredo-de-desenvolvimento-nao-usar-em-producao
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:4200
      TZ: UTC
    ports:
      - '3000:3000'

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      # Consumidos pelo template do nginx (ver frontend/nginx.conf.template).
      # Aqui reproduzem exatamente os valores que estavam fixos no arquivo
      # antes: a API pelo nome do serviço na rede em ponte, o nginx na porta
      # 80 do contêiner. Existem como variável porque
      # docker-compose.rede-host.yml precisa de valores diferentes.
      API_UPSTREAM: api:3000
      LISTEN_PORT: '80'
    ports:
      - '4200:80'

volumes:
  jornada-db-data:
