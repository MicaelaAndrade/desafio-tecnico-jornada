server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A API é servida sob o mesmo domínio do frontend. Isso elimina CORS e mantém
  # o token fora de requisições cross-origin.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Aplicação de página única: qualquer rota desconhecida devolve o index,
  # para que o roteador do Angular assuma o controle.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
